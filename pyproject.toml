[project]
name = "quasi-newton-methods"
version = "0.1.0"
description = "Comparing Adam vs L-BFGS for optimising kappa-eta distance-weighted encoders"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "jax==0.8.1",
    "jaxlib==0.8.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.9",
    "numba>=0.60",
    "numpy>=2.0,<2.4",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "seaborn>=0.13",
    "ucimlrepo>=0.0.7",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.6"]
build-backend = "uv_build"

[tool.uv]
package = false
