[project]
name = "quasi-newton-methods"
version = "0.1.0"
description = "Quasi-Newton hyperparameter optimization for the kappa-eta regression algorithm"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jax==0.8.1",
    "jaxlib==0.8.1",
    "jinja2>=3.1.6",
    "mlx>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numba>=0.60",
    "numpy>=2.0,<2.4",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "ucimlrepo>=0.0.7",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.6"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not network'"
markers = [
    "network: tests that fetch data over the network (e.g. UCI datasets); deselected by default",
]
